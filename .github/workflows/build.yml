name: build

# Every push to main builds with AMX Mod X 1.9 and 1.10 and keeps the package
# as a workflow artifact. semantic-release then reads the Conventional Commits
# since the last tag: for a feat, fix or breaking change it bumps VERSION,
# writes CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]",
# tags vX.Y.Z and creates the GitHub release; publish then builds that tag and
# adds the package to the release. A manual run or a pull request (e.g.
# from Dependabot) builds without publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - name: install 32-bit toolchain for amxxpc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-multilib g++-multilib
      - name: build with AMX Mod X 1.9 (compatibility check)
        run: |
          make compiler AMXX=1.9
          make build AMXX=1.9
      - name: build and package with AMX Mod X 1.10
        run: |
          make clean
          make compiler AMXX=1.10
          make package AMXX=1.10
      - uses: actions/upload-artifact@v7
        with:
          name: gamewe-amxmodx
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - name: install 32-bit toolchain for amxxpc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-multilib g++-multilib
      - name: package with AMX Mod X 1.10
        run: |
          make compiler AMXX=1.10
          make package AMXX=1.10
      - name: add the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY"
