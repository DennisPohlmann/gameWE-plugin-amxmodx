name: build

# Every push (any branch) and every pull request builds with AMX Mod X 1.9
# and 1.10 and packs the package exactly as a release does (1.10); it is kept
# as a workflow artifact for 7 days. Nothing is published then: no tag, no
# GitHub release, no semantic-release.
#
# A release is only made by hand: Actions -> build -> Run workflow on main
# with "release" ticked, or `gh workflow run build.yml --ref main -f
# release=true`. The build job runs first; only when it passed does
# semantic-release read the Conventional Commits since the last tag: for a
# feat, fix or breaking change it bumps VERSION, writes CHANGELOG.md, commits
# that as "chore(release): vX.Y.Z [skip ci]", tags vX.Y.Z and creates the
# GitHub release as a draft. publish then builds that tag, adds the package
# to the draft and only then publishes it, so a release never shows up
# without its files (a failed publish leaves the draft: re-run the failed
# job). docs, chore, ci etc. make no release.
on:
  push:
    # every branch except Dependabot's: its pull request builds them anyway
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release, tag, GitHub release with the packages)
        type: boolean
        default: false

# A newer push or pull request update cancels the older check run; manual
# runs (and so releases) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags, for the version
      - name: install 32-bit toolchain for amxxpc
        # the runner's DNS sometimes fails for the Ubuntu mirrors; retry with
        # short timeouts instead of hanging until the 6 h job limit
        timeout-minutes: 10
        run: |
          apt="sudo apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends gcc-multilib g++-multilib
      - name: build with AMX Mod X 1.9 (compatibility check)
        run: |
          make compiler AMXX=1.9
          make build AMXX=1.9
      - name: build and package with AMX Mod X 1.10
        run: |
          make clean
          make compiler AMXX=1.10
          make package AMXX=1.10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gamewe-amxmodx
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release can only be made from main, not from $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # semantic-release and its plugins as pinned in tools/release/package-lock.json
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          tools/release/node_modules/.bin/semantic-release
      # semantic-release exits 0 also when it made no release: no feat/fix
      # since the last tag, or main moved on while the checks ran. A run with
      # release ticked must not end green then.
      - name: stop if nothing was released
        if: steps.release.outputs.version == ''
        run: |
          echo "::error::semantic-release made no release, see the step above"
          exit 1

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - name: install 32-bit toolchain for amxxpc
        # the runner's DNS sometimes fails for the Ubuntu mirrors; retry with
        # short timeouts instead of hanging until the 6 h job limit
        timeout-minutes: 10
        run: |
          apt="sudo apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends gcc-multilib g++-multilib
      - name: package with AMX Mod X 1.10
        run: |
          make compiler AMXX=1.10
          make package AMXX=1.10
      - name: add the package to the draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"
